version: '3.8'

services:
  # Auth database – dedicated instance
  postgres-auth:
    image: postgres:15-alpine
    container_name: bidmesh-postgres-auth
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bidmesh_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth:/var/lib/postgresql/data

  # Catalog database – dedicated instance
  postgres-catalog:
    image: postgres:15-alpine
    container_name: bidmesh-postgres-catalog
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bidmesh_catalog
    ports:
      - "5434:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data

  # Bidding database – dedicated instance
  postgres-bidding:
    image: postgres:15-alpine
    container_name: bidmesh-postgres-bidding
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bidmesh_bidding
    ports:
      - "5435:5432"
    volumes:
      - postgres_bidding:/var/lib/postgresql/data

  redis-catalog:
    image: redis:7-alpine
    container_name: bidmesh-redis-catalog
    ports:
      - "6380:6379"

  redis-bidding:
    image: redis:7-alpine
    container_name: bidmesh-redis-bidding
    ports:
      - "6381:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: bidmesh-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:29093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1

volumes:
  postgres_auth:
  postgres_catalog:
  postgres_bidding:
