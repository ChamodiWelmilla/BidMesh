server.port=8081
spring.application.name=bidmesh-auth-service

spring.datasource.url=jdbc:postgresql://localhost:5433/bidmesh_auth
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

security.jwt.secret=${JWT_SECRET:SecretKeyForBidMeshAuthentication2026}
