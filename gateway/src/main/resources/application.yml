
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,prometheus
  endpoint:
    health:
      show-details: always

server:
  port: 9000

security:
  jwt:
    secret: ${JWT_SECRET:SecretKeyForBidMeshAuthentication2026}

spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      routes:
        - id: bidding-service-history
          uri: http://localhost:8083
          predicates:
            - Path=/api/bids/**

        # Route for Authentication & User Microservice (:8081)
        - id: auth-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: auth-service-users
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        # Route for Bidding Engine Microservice (:8083)
        - id: bidding-service-bids
          uri: http://localhost:8083
          predicates:
            - Path=/api/auctions/{id}/bids
            - Method=POST

        # Route for WebSockets (Stomp/SockJS) on Bidding Service (:8083)
        - id: bidding-service-ws
          uri: http://localhost:8083
          predicates:
            - Path=/ws-auction/**

        # Route for Auction & Item Catalog Microservice (:8082)
        - id: catalog-service-items
          uri: http://localhost:8082
          predicates:
            - Path=/api/items/**

        - id: catalog-service-auctions
          uri: http://localhost:8082
          predicates:
            - Path=/api/auctions/**
