spring.datasource.url=jdbc:postgresql://localhost:5432/bidmesh
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=bidmesh-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# JWT Secret Key
jwt.secret=YOUR_SECRET_KEY_HERE

# AWS S3 Setup
aws.s3.region=eu-north-1                                                                                                              
aws.s3.bucket=PASTE_YOUR_BUCKET_NAME_HERE                                                                                             
aws.s3.access-key=PASTE_YOUR_ACCESS_KEY_HERE                                                                                          
aws.s3.secret-key=PASTE_YOUR_SECRET_KEY_HERE  
