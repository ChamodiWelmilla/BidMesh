server.port=8083

spring.application.name=bidmesh-bidding-service

spring.datasource.url=jdbc:postgresql://localhost:5435/bidmesh_bidding
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.data.redis.host=localhost
spring.data.redis.port=6381

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=bidmesh-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

security.jwt.secret=${JWT_SECRET:SecretKeyForBidMeshAuthentication2026}

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
