server.port=8082
spring.application.name=bidmesh-catalog-service

spring.datasource.url=jdbc:postgresql://localhost:5432/bidmesh_catalog
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=bidmesh-catalog-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

aws.s3.region=YOUR_AWS_REGION
aws.s3.bucket=PASTE_YOUR_BUCKET_NAME_HERE
aws.s3.access-key=PASTE_YOUR_ACCESS_KEY_HERE
aws.s3.secret-key=PASTE_YOUR_SECRET_KEY_HERE
