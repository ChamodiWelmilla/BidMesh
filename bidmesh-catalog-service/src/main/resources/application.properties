server.port=8082
spring.application.name=bidmesh-catalog-service

spring.datasource.url=jdbc:postgresql://localhost:5434/bidmesh_catalog
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

spring.data.redis.host=localhost
spring.data.redis.port=6380

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=bidmesh-catalog-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

security.jwt.secret=${JWT_SECRET:SecretKeyForBidMeshAuthentication2026}

aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
